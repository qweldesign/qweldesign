<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ちいさなサイト工房 OGP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;700&family=Shippori+Mincho:wght@500;700&display=swap">
<style>
  /*
   * OGP 画像 (assets/ogp.jpg) の原稿
   * 開発者ツールのデバイス表示で 1200 × 630 にし, 「スクリーンショットをキャプチャ」で撮る
   * 配色は scss/settings/_colorSystem.scss の3段 (base / dark / light) と同じ値
   */
  :root {
    --blue: #209fdf;                   /* primary */
    --blue-dark: hsl(200.1, 74.9%, 35%);
    --blue-light: hsl(200.1, 74.9%, 95%);
    --orange: #ffc080;                 /* secondary */
    --orange-dark: hsl(30.2, 100%, 35%);
    --orange-light: hsl(30.2, 100%, 95%);
    --ink: #262626;
    --ink-dim: #4d4d4d;
    --mincho: "Shippori Mincho", "Yu Mincho", serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }

  html, body {
    margin: 0;
    background: #888;
  }

  .ogp {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 300px;
    align-items: center;
    gap: 40px;
    width: 1200px;
    height: 630px;
    margin: 30px auto;
    padding: 24px 72px 84px;
    box-sizing: border-box;
    overflow: hidden;
    background: linear-gradient(to bottom, var(--blue-light), var(--blue-light) 70%, #fff);
    border-top: 12px solid var(--orange);
    color: var(--ink);
    font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
  }

  /* 下端の青い帯 (つくる) とオレンジの帯 (まもる) */
  .ogp::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    height: 14px;
    background: linear-gradient(to right, var(--blue) 0 50%, var(--orange) 50% 100%);
  }

  .ogp__text {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .ogp__label {
    margin: 0;
    color: var(--blue-dark);
    font-family: var(--mono);
    font-size: 24px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .ogp__label::before {
    content: "✦ ";
    color: var(--orange);
  }

  .ogp__name {
    margin: 0;
    font-family: var(--mincho);
    font-size: 72px;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  .ogp__lead {
    margin: 6px 0 0;
    font-family: var(--mincho);
    font-size: 48px;
    font-weight: 700;
    line-height: 1.35;
  }

  .ogp__sub {
    margin: 0;
    font-family: var(--mincho);
    font-size: 30px;
    font-weight: 700;
    line-height: 1.35;
  }

  .ogp__tagline {
    margin: 10px 0 0;
    font-family: var(--mincho);
    font-size: 30px;
    font-weight: 700;
  }

  .ogp__tagline span {
    background: linear-gradient(transparent 50%, var(--orange) 50%);
  }

  .ogp__by {
    position: absolute;
    left: 72px;
    bottom: 48px;
    margin: 0;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 24px;
    letter-spacing: 0.12em;
  }

  .ogp__side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    padding-top: 6px;
  }

  /* ロゴ (assets/logo.svg の機体とプロペラ. キャプチャ用に動きは止める) */
  .ogp__logo {
    width: 330px;
    height: auto;
  }

  .ogp__logo .main {
    fill: none;
    stroke: var(--blue);
    stroke-miterlimit: 10;
    stroke-width: 6px;
  }

  .ogp__logo .wind {
    fill: none;
    stroke: var(--blue);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 18 18;
    opacity: 0.3;
  }

  .ogp__tags {
    display: flex;
    gap: 12px;
  }

  .ogp__tag {
    padding: 6px 24px;
    border-radius: 36px;
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.12em;
  }

  .ogp__tag.is-build {
    background: var(--blue-dark);
    color: #fff;
  }

  .ogp__tag.is-care {
    background: var(--orange);
    color: var(--ink);
  }
</style>
</head>
<body>
  <div class="ogp">
    <div class="ogp__text">
      <p class="ogp__label">Small Site Studio</p>
      <p class="ogp__name">ちいさなサイト工房</p>
      <p class="ogp__lead">更新を頼める、壊れにくい。</p>
      <p class="ogp__sub">小さな事業のためのウェブサイト</p>
      <p class="ogp__tagline"><span>軽いサイトを、丁寧に作る。</span></p>
    </div>

    <div class="ogp__side">
      <svg class="ogp__logo" viewBox="0 40 576 420" aria-hidden="true">
        <path class="wind" d="M140,220 C180,260 240,270 300,260" />
        <path class="wind" d="M140,240 C190,280 250,290 310,275" />
        <path class="wind" d="M140,260 C200,300 260,310 320,290" />
        <defs>
          <!-- <use> の複製には CSS が届かないので, 羽根の色は fill 属性で指定する -->
          <path id="bladeA" fill="#ffc080" d="M98.55,220.5c2.06-15.75-2.52-51.01-23.59-84.75-18.21-29.13-46.76-56.73-60.69-48.9-14.21,7.98,2.56,40.48,23.59,71.72,22.05,32.73,46.47,57.84,60.69,61.93Z"/>
          <path id="bladeB" fill="#ffc080" d="M99.33,220.5c-1.54,11.81,1.89,38.26,17.7,63.57,13.65,21.86,35.07,42.54,45.51,36.67,10.65-5.99-1.92-30.36-17.7-53.79-16.53-24.54-34.84-43.38-45.51-46.46Z"/>
        </defs>
        <path class="main" d="M144.48,199.11c-26.58-44.58-73.65-56.37-97.31-41.11-20.98,13.53-26.58,50.37-12.17,70.49,23.19,32.36,98.33,21.67,121.62-11.75,18.33-26.29,5.22-67.65,0-67.54-12.51.27-22.42,239.13-9.12,240.81,1.53.2-17.98-119.8,42.57-167.4,53.17-41.79,165.39,48.85,243.24,11.75,9.21-4.4,28.86-13.75,27.36-20.55-1.86-8.42-36.18-13.23-42.57-2.94-5.96,9.6,10.05,36.09,30.4,41.12,33.53,8.26,76.56-25.37,82.1-76.35,3.24-29.77.07-64.02-12.16-64.6-13.1-.63-22.72,31.19-18.24,64.6,6.88,51.33,51.2,79.55,57.77,82.23"/>
        <path class="main" d="M204.75,151.9c27.27,66.04,44.47,60.04,52.29,58.22,11.4-2.67,10.16-46.26,17.43-46.58,7.75-.33,9.18,49.29,23.24,52.4,9.9,2.17,100.7-58.97,136.54-148.44"/>
        <g transform="rotate(0,98,220)" opacity="0.3">
          <use href="#bladeA"/>
          <use href="#bladeB"/>
        </g>
        <g transform="rotate(10,98,220)">
          <use href="#bladeA"/>
          <use href="#bladeB"/>
        </g>
      </svg>
      <div class="ogp__tags">
        <span class="ogp__tag is-build">つくる</span>
        <span class="ogp__tag is-care">まもる</span>
      </div>
    </div>

    <p class="ogp__by">by QWEL.DESIGN 福井・越前海岸</p>
  </div>
</body>
</html>
