<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card | QWEL.DESIGN</title>
    <!--
      名刺の原稿 (日本の標準サイズ 91 × 55 mm, 塗り足し 3 mm 込みで 97 × 61 mm)
      OGP と同じ昼の便の構図: 雲海の上を飛ぶ機体と, 見出しの組み方
      画面では仕上がり線 (点線) と安全域を表示し, 印刷 / PDF 書き出しでは 1 面 1 ページで出力する
      雲の配置は乱数の種を固定しているので, 何度書き出しても同じ絵になる
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=IBM+Plex+Mono&family=Noto+Sans+JP:wght@400&family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
    <style>
      :root {
        /* 昼の便の配色 (_flight.scss・ogp.html と同値) */
        --sky: hsl(200, 100%, 95%); /* 空の上端: 白地に primary の青をごく薄く */
        --horizon: #ffffff;         /* 空の下端 */
        --ink: #262626;             /* darkest */
        --ink-dim: #4d4d4d;         /* darker */
        --star: #209fdf;            /* primary */
        --lamp: #ff8000;            /* secondary--active */

        --bleed: 3mm;               /* 塗り足し */
        --safe: 4mm;                /* 仕上がり線から文字までの余白 */
      }

      html, body {
        margin: 0;
        background: #ccc;
      }

      body {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12mm;
        padding: 12mm;
        font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      }

      /* 1 面 (塗り足し込み) */
      .card {
        position: relative;
        width: calc(91mm + var(--bleed) * 2);
        height: calc(55mm + var(--bleed) * 2);
        overflow: hidden;
        background: linear-gradient(to bottom, var(--sky), var(--horizon));
        color: var(--ink);
        box-shadow: 0 2mm 6mm rgba(20, 40, 70, 0.15);
      }

      /* 仕上がりの範囲. 中身はこの中に, 安全域を空けて置く */
      .card__trim {
        position: absolute;
        inset: var(--bleed);
      }

      /* 仕上がり線 (画面表示のみ) */
      .card::after {
        content: "";
        position: absolute;
        inset: var(--bleed);
        border: 0.2mm dashed rgba(255, 0, 80, 0.45);
        pointer-events: none;
      }

      .card__clouds {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* ---- 表面 ---- */
      .card__logo {
        position: absolute;
        top: 3mm;
        right: 3mm;
        width: 30mm;
        height: auto;
      }

      .card__eyebrow {
        position: absolute;
        top: var(--safe);
        left: var(--safe);
        margin: 0;
        color: var(--ink-dim);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 7pt;
        letter-spacing: 0.16em;
      }

      .card__person {
        position: absolute;
        top: 12mm;
        left: var(--safe);
      }

      .card__role {
        margin: 0 0 1.5mm;
        color: var(--lamp);
        font-size: 7pt;
        letter-spacing: 0.16em;
      }

      .card__name {
        margin: 0;
        font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
        font-weight: 500;
        font-size: 17.5pt;
        line-height: 1.2;
        letter-spacing: 0.2em;
      }

      .card__nameEn {
        margin: 1.5mm 0 0;
        color: var(--star);
        font-family: "Cormorant Garamond", "Times New Roman", serif;
        font-style: italic;
        font-weight: 500;
        font-size: 12.25pt;
        letter-spacing: 0.08em;
      }

      .card__nameEn::after {
        content: "✶";
        margin-inline-start: 0.2em;
        color: var(--lamp);
        font-style: normal;
        font-size: 0.6em;
        vertical-align: super;
      }

      /* 連絡先 (ラベルと値の組) */
      .card__contact {
        position: absolute;
        top: 34.5mm;
        left: var(--safe);
        display: grid;
        grid-template-columns: auto auto;
        gap: 2mm;
        margin: 0;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 7pt;
        letter-spacing: 0.06em;
      }

      .card__contact dt {
        color: var(--lamp);
        letter-spacing: 0.14em;
      }

      .card__contact dd {
        margin: 0;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      .card__footer {
        position: absolute;
        right: var(--safe);
        bottom: var(--safe);
        left: var(--safe);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-top: 2mm;
        border-top: 0.2mm solid var(--ink-dim);
        color: var(--ink-dim);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 7pt;
        letter-spacing: 0.08em;
      }

      /* ---- 裏面 ---- */
      .card__title {
        position: absolute;
        top: 6mm;
        left: var(--safe);
        margin: 0;
        font-family: "Cormorant Garamond", "Times New Roman", serif;
        font-weight: 500;
        font-size: 24pt;
        line-height: 1;
        letter-spacing: 0.016em;
      }

      .card__title em {
        color: var(--star);
        font-style: italic;
      }

      .card__lead {
        position: absolute;
        top: 27mm;
        left: var(--safe);
        width: 48mm;
        margin: 0;
        color: var(--lamp);
        font-size: 7pt;
        line-height: 1.8;
        letter-spacing: 0.08em;
      }

      .card__qr {
        position: absolute;
        top: var(--safe);
        right: var(--safe);
        width: 25mm;
        padding: 2mm 2mm 1.4mm;
        border-radius: 1.5mm;
        background: #ffffff;
        text-align: center;
      }

      .card__qr svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .card__qr figcaption {
        margin-top: 1.5mm;
        color: var(--ink-dim);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 5pt;
        letter-spacing: 0.08em;
      }

      /* 印刷 / PDF 書き出し: 塗り足し込みの 1 面を 1 ページに */
      @page {
        size: 97mm 61mm;
        margin: 0;
      }

      @media print {
        html, body {
          background: none;
        }

        body {
          display: block;
          padding: 0;
        }

        .card {
          box-shadow: none;
          break-after: page;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }

        .card::after {
          content: none;
        }
      }
    </style>
  </head>

    <script>
      /**
       * 雲海 (js/dot-band.js の昼のプリセットを, 印刷に耐えるベクターの円で描く)
       * 書き出すたびに雲の形が変わらないよう, 面ごとに乱数の種を固定する
       */
      function seededRandom(seed) {
        return () => {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      document.querySelectorAll('[data-clouds]').forEach((svg) => {
        const random = seededRandom(Number(svg.dataset.clouds));
        const gaussian = () => Math.sqrt(-2 * Math.log(1 - random())) * Math.cos(Math.PI * 2 * random());

        // 座標は mm (塗り足し込み 97 × 61 mm). 帯は水平で, 下寄り
        const width = 97;
        const height = 61;
        const centerY = height * 0.95;
        const sigma = height * 0.09;
        const count = 60;
        const edgeFade = 0.5;
        const opacity = 0.16;

        svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        const ns = 'http://www.w3.org/2000/svg';
        for (let i = 0; i < count; i++) {
          const seed = random();
          const v = gaussian() * 0.5;
          const circle = document.createElementNS(ns, 'circle');
          circle.setAttribute('cx', (random() * (width + 6) - 3).toFixed(2));
          circle.setAttribute('cy', (centerY + v * sigma * 2).toFixed(2));
          circle.setAttribute('r', (1 + seed * 3.6).toFixed(2));
          circle.setAttribute('fill', '#209fdf');
          circle.setAttribute('fill-opacity', ((0.5 + seed * 0.5) * Math.exp(-(v ** 2) * edgeFade) * opacity).toFixed(3));
          svg.appendChild(circle);
        }
      });

      // 書き出しスクリプト (export.js) に, 雲の配置が終わったことを知らせる
      document.documentElement.dataset.cloudsReady = 'true';
    </script>
